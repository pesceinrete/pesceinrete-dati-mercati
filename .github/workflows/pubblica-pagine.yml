name: Pubblica i file della pagina su GitHub Pages

# Serve i file di web/ a un indirizzo stabile, così il sito li legge da
# qui e nessuno deve più caricare niente via FTP. Si attiva da solo a ogni
# aggiornamento dei dati. Prima volta: Settings → Pages → Source:
# "GitHub Actions".
on:
  push:
    branches: [main, master]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pagina inglese e cartella da pubblicare
        run: |
          pip install pillow -q
          python strumenti/componi_pagina.py
          python strumenti/traduci_pagina.py
          python strumenti/genera_anteprime_social.py
          mkdir -p pubblico
          cp web/dati-mercati.html web/dati-mercati.en.html pubblico/
          cp -r web/data pubblico/data
          # intestazioni CORS non servono: GitHub Pages le manda da solo
          echo "Pesceinrete — file di Dati e mercati" > pubblico/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pubblico
      - id: deploy
        uses: actions/deploy-pages@v4
