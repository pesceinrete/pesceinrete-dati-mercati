name: Primo caricamento dei dati veri

# Si lancia una volta sola, dalla scheda Actions, con il pulsante
# "Run workflow". Non serve un terminale: la macchina di GitHub scarica le
# fonti, cancella il marcatore dei dati dimostrativi, ricostruisce la
# pagina e salva tutto nel repository. Da quel momento il ciclo
# quotidiano tiene i dati aggiornati da solo.
on:
  workflow_dispatch:
    inputs:
      conferma:
        description: "Scrivere SI per sostituire i dati dimostrativi con quelli veri"
        required: true
        default: "NO"

permissions:
  contents: write
  actions: write

jobs:
  carica:
    if: github.event.inputs.conferma == 'SI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifica i calcoli
        run: pip install pytest pillow -q && python -m pytest tests/ -q

      - name: Interroga le fonti senza scrivere (resoconto nel riepilogo)
        run: |
          {
            echo "### Controllo delle fonti"
            echo '```'
            python ingest/ssb_laks.py --db dati/archivio.sqlite --controllo 2>&1 || true
            python ingest/eurostat_comext.py --db dati/archivio.sqlite --controllo --prodotto salmone 2>&1 || true
            python ingest/eumofa_import.py --db dati/archivio.sqlite --controllo 2>&1 || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Archivio nuovo, senza dati dimostrativi
        run: |
          rm -f dati/archivio.sqlite dati/DIMOSTRATIVO dati/eumofa_stato.json
          rm -f web/data/sintesi-*.html web/data/prodotti/*.json web/data/social/*.png
          rm -f web/bollettini/* web/newsletter/*
          mkdir -p dati

      - name: Cambi BCE
        run: python ingest/bce_cambi.py --db dati/archivio.sqlite --valuta NOK

      - name: Salmone SSB
        run: python ingest/ssb_laks.py --db dati/archivio.sqlite

      - name: Importazioni italiane Comext, tutte le specie
        continue-on-error: true
        run: python ingest/eurostat_comext.py --db dati/archivio.sqlite

      - name: Importazioni settimanali EUMOFA, dal 2023
        run: python ingest/eumofa_import.py --db dati/archivio.sqlite

      - name: Ricostruisci la pagina
        run: |
          python costruisci_dati_sito.py --db dati/archivio.sqlite --uscita web/data
          python strumenti/componi_pagina.py
          python strumenti/traduci_pagina.py
          python strumenti/genera_anteprime_social.py
          python strumenti/genera_newsletter.py
          python strumenti/valuta_avvisi.py
          python strumenti/cruscotto_redazione.py --db dati/archivio.sqlite

      - name: Collaudo
        run: |
          npm install jsdom --silent --no-fund --no-audit
          python strumenti/costruisci_anteprima.py
          python strumenti/costruisci_anteprima.py --lingua en
          NODE_PATH=$PWD/node_modules node tests/collauda_pagina.js
          LINGUA=en NODE_PATH=$PWD/node_modules node tests/collauda_pagina.js

      - name: Salva nel repository
        run: |
          git config user.name "Primo caricamento"
          git config user.email "redazione@pesceinrete.com"
          git add -A dati/ web/data/ web/bollettini/ web/newsletter/ web/dati-mercati.html web/dati-mercati.en.html
          git commit -m "Primo caricamento dei dati veri $(date -u +%Y-%m-%d)"
          git push

      # Un salvataggio fatto da un workflow non fa partire la pubblicazione,
      # e l'innesco "workflow_run" non va bene con deploy-pages (cerca i file
      # nell'esecuzione sbagliata). Si avvia quindi la pubblicazione a mano,
      # da qui: l'avvio manuale è permesso anche al token del workflow.
      - name: Avvia la pubblicazione su GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pubblica-pagine.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Cruscotto
        uses: actions/upload-artifact@v4
        with:
          name: cruscotto-primo-caricamento
          path: redazione/cruscotto.html

      - name: Riepilogo
        run: |
          echo "### Specie pubblicate" >> $GITHUB_STEP_SUMMARY
          python - <<'FINE' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("web/data/mercati.json"))
          print(f"Stato: **{d['stato']}**\n")
          print("| Specie | Ultima settimana | €/kg | Fonte |")
          print("|---|---|---|---|")
          for p in d["prodotti"]:
              print(f"| {p['nome']} | {p['ultimo_periodo']} | {p['prezzo_eur_kg']:.2f} | {p['fonte']} |")
          print("\n### Esito delle fonti\n")
          print("| Fonte | Esito | Nuove | Note |")
          print("|---|---|---|---|")
          import sqlite3
          db = sqlite3.connect("dati/archivio.sqlite"); db.row_factory = sqlite3.Row
          for r in db.execute("SELECT * FROM esecuzioni WHERE esito != 'completata' OR fonte LIKE 'EUMOFA%' "
                              "OR fonte LIKE 'SSB%' OR fonte LIKE 'BCE%' ORDER BY avviata_il"):
              print(f"| {r['fonte']} | {r['esito']} | {r['nuove']} | {(r['messaggio'] or '')[:160]} |")
          FINE
